<table
    cellpadding="0"
    cellspacing="0"
    width="100%"
    role="presentation"
    style="background-color: transparent; min-width: 100%; border-top: 0px; border-right: 15px solid #76BC21; border-bottom: 0px; border-left: 15px solid #76BC21; "
    class="stylingblock-content-wrapper"
>
    <tr>
        <td style="padding: 7px 30px 10px; " class="stylingblock-content-wrapper camarker-inner">
            <!--
href="cambiarLink": enlace de destino
alias"cambiarAlias": nombre para encontrar CTA en reportes
CambiarLabel: Cambiar por texto de botón
-->
            <div style="text-align: center;">
                <a
                    href="%%= RedirectTo(@link) =%%"
                    alias="OFERTAS"
                    style="background: #76BC21; border: px solid #76BC21; text-decoration: none; padding: 25px 30px; color: #fff; border-radius: 6px; display:inline-block; mso-padding-alt:0;text-underline-color:#ff5028; font-size: 20px"
                    class="ctaHover"
                    ><!--[if mso
                        ]><i
                            style="letter-spacing: 25px;mso-font-width:-100%;mso-text-raise:30pt"
                            hidden
                            >&nbsp;</i
                        ><!
                    [endif]--><span style="mso-text-raise:15pt;">¡Contesta y participa aquí! </span
                    ><!--[if mso
                        ]><i style="letter-spacing: 25px;mso-font-width:-100%" hidden>&nbsp;</i><!
                    [endif]-->
                </a>
            </div>
        </td>
    </tr>
</table>
