<table
    cellpadding="0"
    cellspacing="0"
    width="100%"
    role="presentation"
    style="background-color: #FFFFFF; min-width: 100%; "
    class="stylingblock-content-wrapper"
>
    <tr>
        <td style="padding: 10px 30px 20px; " class="stylingblock-content-wrapper camarker-inner">
            <!--
href="cambiarLink": enlace de destino
alias"cambiarAlias": nombre para encontrar CTA en reportes
CambiarLabel: Cambiar por texto de botón
-->
            <div style="text-align: center;">
                <a
                    href="%%= RedirectTo(@ctaUrl) =%%"
                    alias="OFERTAS"
                    style="background: #FF4713; border: px solid #FF4713; text-decoration: none; padding: 16px 20px; color: #fff; border-radius: 6px; display:inline-block; mso-padding-alt:0;text-underline-color:#ff5028; font-size: 18px"
                    class="ctaHover"
                    ><!--[if mso
                        ]><i
                            style="letter-spacing: 25px;mso-font-width:-100%;mso-text-raise:30pt"
                            hidden
                            >&nbsp;</i
                        ><!
                    [endif]--><span style="mso-text-raise:15pt;">Responde la encuesta</span
                    ><!--[if mso
                        ]><i style="letter-spacing: 25px;mso-font-width:-100%" hidden>&nbsp;</i><!
                    [endif]-->
                </a>
            </div>
        </td>
    </tr>
</table>
