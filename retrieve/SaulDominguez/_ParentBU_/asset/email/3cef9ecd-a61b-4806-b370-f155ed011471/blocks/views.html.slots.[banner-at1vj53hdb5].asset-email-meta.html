                .ie-radio-check {
                    display: inline-block;

                    margin: 0;
                    margin: 0 0 0 -9999px;
                    float: left;
                    position: absolute;
                    -webkit-appearance: none;
                }
                input:checked ~ .ie-carousel {
                    display: block !important;
                }
                input:checked ~ .ie-carouselFallback {
                    display: none;
                }
                .mc-carousel-id-1696281577894 {
                    text-align: center;
                }

                    margin: 0 auto;
                }

                .ie-carousel-wrap {
                    position: relative;
                }
                .ie-carousel input:focus ~ .ie-thumb {
                    outline: Highlight auto 2px;
                    outline: -webkit-focus-ring-color auto 5px;
                    outline-offset: 3px;
                }
                .ie-slide {
                    width: 100%;
                    background-size: contain;
                    background-position: center;
                    background-repeat: no-repeat;
                    display: block;
                }
                .mc-carousel-id-1696281577894 .ie-slide {
                    padding-bottom: 100%;
                }
                .ie-thumb {
                    width: 1em;
                    height: 1em;
                    border-radius: 50%;
                    margin: 0.3em 0.1em;
                    display: inline-block;
                    border: 0.1em solid;
                }
                .ie-carousel:not(:has(input:checked)) .ie-start ~ .ie-thumb {
                    background: currentColor;
                }
                input:checked ~ .ie-thumb {
                    background: currentColor !important;
                }
                .ie-pos-arrow {
                    max-height: 0;
                    text-align: left;
                }
                .ie-arrow {
                    display: inline-block;
                    max-height: 0;
                    max-width: 0;
                    border: 1em solid transparent;
                    border-right-color: currentColor;
                    border-left-width: 0;
                    opacity: 0.99;
                    position: relative;
                    vertical-align: middle;
                    margin: 0 5% 0 0.2em;
                }
                .mc-carousel-id-1696281577894 .ie-arrow-padding {
                    display: inline-block;
                    vertical-align: middle;
                    padding-bottom: 100%;
                    width: 0px;
                }
                .ie-apple-clickarea {
                    height: 200px;
                    width: 3em;
                    width: clamp(45px, 3em, 70px);
                    float: left;
                    transform: translate(-5px, -50%);
                }

                .mc-carousel-id-1696281577894 input:checked ~ * .ie-pos-arrow,
                .ie-start {
                    text-align: right;
                }
                .mc-carousel-id-1696281577894 input:checked ~ * .ie-pos-arrow .ie-apple-clickarea,
                .ie-start .ie-apple-clickarea {
                    float: right;
                    transform: translate(5px, -50%);
                }
                .mc-carousel-id-1696281577894 input:checked ~ * .ie-arrow,
                .ie-start .ie-arrow {
                    border-right-width: 0;
                    border-left: 1em solid;
                    margin: 0 0.2em 0 5%;
                }

                .mc-carousel-id-1696281577894 input:checked ~ .ie-start ~ * .ie-end {
                    display: block;
                    text-align: left;
                }
                .mc-carousel-id-1696281577894 input:checked ~ .ie-start ~ * .ie-end .ie-arrow {
                    border-left-width: 0;
                    border-right: 1em solid;
                    margin: 0 5% 0 0.2em;
                }
                .mc-carousel-id-1696281577894 input:checked + .ie-pos-arrow,
                .mc-carousel-id-1696281577894 input:checked ~ label label .ie-pos-arrow {
                    display: none;
                }
                .mc-carousel-id-1696281577894
                    input:checked
                    ~ .ie-start
                    ~ *
                    .ie-end
                    .ie-arrow
                    .ie-apple-clickarea {
                    float: left;
                    transform: translate(-5px, -50%);
                }

                .ie-img-wrap {
                    display: none;
                }
                .ie-carousel .ie-mid .ie-img1 {
                    display: block;
                    position: initial;
                }
                .mc-carousel-id-1696281577894 input:checked ~ label .ie-mid .ie-img1 {
                    display: none;
                }

                .mc-carousel-id-1696281577894 input:checked + .ie-img1 ~ * .ie-mid .ie-img1,
                .mc-carousel-id-1696281577894 input:checked + .ie-img2 ~ * .ie-mid .ie-img2,
                .mc-carousel-id-1696281577894 input:checked + .ie-img3 ~ * .ie-mid .ie-img3 {
                    display: block;
                }

                .mc-carousel-id-1696281577894 input:checked ~ .ie-end {
                    display: none;
                }

                input:checked + .mc-carousel-id-1696281577894 .ie-img1 span {

                }

                .ie-carousel {
                    direction: rtl;
                }
                .ie-carousel label {
                    direction: ltr;
                }
                .ie-arrow-wrap {
                    display: table;
                    width: 100%;
                    overflow: hidden;
                }
                .ie-arrow-wrap:hover .ie-arrow {
                    transform: scale(1.1);
                }
            </style>
