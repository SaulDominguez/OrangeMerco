<table
    cellpadding="0"
    cellspacing="0"
    width="100%"
    role="presentation"
    class="stylingblock-content-wrapper"
    style="min-width: 100%; "
>
    <tr>
        <td class="stylingblock-content-margin-cell" style="padding: 0px 6px 0px 0px; ">
            <table
                cellpadding="0"
                cellspacing="0"
                width="100%"
                role="presentation"
                style="background-color: transparent; min-width: 100%; "
                class="stylingblock-content-wrapper"
            >
                <tr>
                    <td
                        style="padding: 15px 0px 0px; "
                        class="stylingblock-content-wrapper camarker-inner"
                    >
                        <!--
href="cambiarLink": enlace de destino
alias"cambiarAlias": nombre para encontrar CTA en reportes
CambiarLabel: Cambiar por texto de botón
-->
                        <div style="text-align: center;">
                            <a
                                alias="OFERTAS"
                                class="ctaHover"
                                href="%%= RedirectTo(@link) =%%"
                                style="background: #76BC21; border: px solid #76BC21; text-decoration: none; padding: 16px 20px; color: #fff; border-radius: 6px; display:inline-block; mso-padding-alt:0;text-underline-color:#ff5028; font-size: 15px"
                                ><span style="mso-text-raise:15pt;"
                                    >&iexcl;Contesta y participa aqu&iacute;!</span
                                ><!--[if mso
                                    ]><i style="letter-spacing: 25px;mso-font-width:-100%" hidden
                                        >&nbsp;</i
                                    ><!
                                [endif]-->
                            </a>
                        </div>
                        <h2
                            style="color:#181818;font-family:Arial,helvetica,sans-serif;font-size:22px;font-style:normal;font-weight:bold;line-height:1;"
                        >
                            <span style="font-size:17px;">Contestando el formulario:</span>
                        </h2>
                        <table
                            align="left"
                            border="0"
                            cellpadding="0"
                            cellspacing="0"
                            style="margin-left: auto;margin-right:auto; width:100%;"
                        >
                            <tr>
                                <td height="30" style="text-align: left;" width="30">
                                    <img
                                        alt=""
                                        height="25"
                                        src="https://image.hello.merco.email/lib/fe2a11747364047f721079/m/1/362c8184-e34a-4574-9247-89af0b73f16b.png"
                                        style="height: 35px; width: 35px; border: 0px; display: block;"
                                        width="25"
                                    />
                                </td>
                                <td height="10">Recibes promociones personalizadas.</td>
                            </tr>
                            <tr>
                                <td height="30" style="text-align: left" width="30">
                                    <img
                                        alt=""
                                        height="10"
                                        src="https://image.hello.merco.email/lib/fe2a11747364047f721079/m/1/362c8184-e34a-4574-9247-89af0b73f16b.png"
                                        style="height: 35px; width: 35px; border: 0px; display: block;"
                                        width="25"
                                    />
                                </td>
                                <td height="30">
                                    <p></p>
                                    <div style="line-height: 150%; text-align: justify;">
                                        <div style="text-align: left;">
                                            Participas para ganar una tarjeta con un valor de $2,000
                                            en Merco.<br />
                                            &nbsp;
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr></tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
