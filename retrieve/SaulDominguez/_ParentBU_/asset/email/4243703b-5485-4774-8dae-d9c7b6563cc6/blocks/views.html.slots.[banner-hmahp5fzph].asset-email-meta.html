<table
    cellpadding="0"
    cellspacing="0"
    width="100%"
    role="presentation"
    style="background-color: #FF4713; min-width: 100%; "
    class="stylingblock-content-wrapper"
>
    <tr>
        <td style="padding: 10px 30px 5px; " class="stylingblock-content-wrapper camarker-inner">
            <!--
href="cambiarLink": enlace de destino
alias"cambiarAlias": nombre para encontrar CTA en reportes
CambiarLabel: Cambiar por texto de botón
-->
            <div style="text-align: center;">
                <a
                    href="%%= RedirectTo(@link) =%%"
                    alias="OFERTAS"
                    style="background: #76BC21; border: px solid #EB6232; text-decoration: none; padding: 16px 20px; color: #fff; border-radius: 6px; display:inline-block; mso-padding-alt:0;text-underline-color:#ff5028; font-size: 15px"
                    class="ctaHover"
                    ><!--[if mso
                        ]><i
                            style="letter-spacing: 25px;mso-font-width:-100%;mso-text-raise:30pt"
                            hidden
                            > </i
                        ><!
                    [endif]--><span style="mso-text-raise:15pt;">PARTICIPA AQUÍ</span
                    ><!--[if mso
                        ]><i style="letter-spacing: 25px;mso-font-width:-100%" hidden> </i><!
                    [endif]-->
                </a>
            </div>
        </td>
    </tr>
</table>
