    /* custom styles */
    h1,
    h2,
    h3 {
        font-family: Tahoma, Arial, sans-serif;
    }

        line-height: 34px;

        font-weight: 700;
    }
    .ctaHover {
        transition: opacity 0.3s !important;
    }
    .ctaHover:hover {
        opacity: 0.7 !important;
    }
</style>
