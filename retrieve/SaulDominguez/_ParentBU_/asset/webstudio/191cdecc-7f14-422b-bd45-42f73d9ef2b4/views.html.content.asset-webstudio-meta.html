<!doctype html>
<html class="no-js" lang="es">
    %%= ContentBlockByID(18042) =%%
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fiestononón-Merco-Mostar registro</title>
        <meta name="description" content="Resultado de la búsqueda" />
        <link href="https://merco.mx/images/favicon.png" rel="shortcut icon" type="image/x-icon" />

        <!-- CSS BOOTSTRAP -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor"
            crossorigin="anonymous"
        />
        <!-- CSS -->
        <link rel="stylesheet" href="https://cloud.hello.merco.email/style-fiestononon" />
    </head>

    <body>
        <div class="container-fluid noPadding">
            <!-- Content -->
            <header>
                <div class="row justify-content-center">
                    <div class="col-12 col-md-10 col-lg-8 col-xl-6">
                        <img
                            src="https://image.hello.merco.email/lib/fe2a11747364047f721079/m/1/892417a8-10f3-4ae9-a0fa-76bd28d85a37.jpg"
                            alt="Fiestononón Merco"
                            class="img-fluid"
                        />
                    </div>
                </div>
            </header>

            <section class="section1 pt-2 pb-4 pt-md-5 pb-md-5">
                <div class="row justify-content-center">
                    <div class="col-11 col-md-11 col-lg-10 col-xl-9 col-xxl-7 noPadding">
                        <h1 class="text-center mb-2 mb-md-4">%%= v(@mensaje) =%%</h1>
                        <div class="row justify-content-center contentForm">
                            <div class="col-12 p-2 p-md-5 text-center">
                                <div class="form-group">
                                    <label class="resultado"><b>Nombre</b></label>
                                    <h2><b>%%= v(@nombre) =%%</b></h2>
                                </div>

                                <div class="form-group mt-4">
                                    <label class="resultado"><b>Apellido</b></label>
                                    <h2><b>%%= v(@apellidos) =%%</b></h2>
                                </div>

                                <div class="form-group mt-4">
                                    <label class="resultado"><b>Correo</b></label>
                                    <h2><b>%%= v(@correo) =%%</b></h2>
                                </div>

                                <div class="form-group mt-4">
                                    <label class="resultado"><b>No. de ticket</b></label>
                                    <h2><b>%%= v(@ticket) =%%</b></h2>
                                </div>

                                <div class="form-group mt-4">
                                    <label class="resultado"><b>Monto Ticket</b></label>
                                    <h2><b>%%= v(@monto) =%%</b></h2>
                                </div>

                                <div class="form-group mt-4">
                                    <label class="resultado"><b>Fecha de compra</b></label>
                                    <h2><b>%%= v(@fecha) =%%</b></h2>
                                </div>
                            </div>

                            <div class="col-12 text-center mb-5">
                                <a
                                    href="https://cloud.hello.merco.email/fiestononon-merco"
                                    class="btnForm"
                                    >Cargar nuevo registro</a
                                >
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <footer class="py-1">
                <div class="row">
                    <div class="col-12">
                        <div class="logo text-center">
                            <img
                                src="https://image.hello.merco.email/lib/fe2a11747364047f721079/m/1/6d845bd4-5822-4d33-829b-faffec1d0632.png"
                                alt="Logo Merco"
                                class="img-fluid logoMerco"
                            />
                            <p>® All rights reserved — MERCO 2023</p>
                        </div>
                    </div>
                </div>
            </footer>
            <!-- Content -->
        </div>

        <!-- JS BOOTSTRAP -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2"
            crossorigin="anonymous"
        ></script>

        <!-- fontawesome -->
        <script src="https://kit.fontawesome.com/9845fe7041.js" crossorigin="anonymous"></script>
    </body>
</html>
