<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Consulta de Registros - Fiestononón - Merco</title>
        <meta name="description" content="Consulta los registros" />
        <link href="https://merco.mx/images/favicon.png" rel="shortcut icon" type="image/x-icon" />
        <!-- CSS BOOTSTRAP -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor"
            crossorigin="anonymous"
        />
        <!-- CSS -->
        <link rel="stylesheet" href="https://cloud.hello.merco.email/style-merco-registro" />
    </head>

    <body>
        <div class="container-fluid noPadding">
            <!-- Header -->
            <header>
                <div class="row justify-content-center">
                    <div class="col-12 text-center py-3">
                        <img
                            loading="lazy"
                            width="200"
                            height="85"
                            src="https://image.hello.merco.email/lib/fe2a11747364047f721079/m/1/7afd07b6-1980-440b-bd37-cdff0afb9735.png"
                            alt="Logo Merco"
                            class="img-fluid logoMercoHero"
                        />
                    </div>
                </div>
            </header>

            <!-- Section -->
            <section class="section1 pt-2 pb-4 pt-md-5 pb-md-5">
                <div class="row justify-content-center">
                    <div class="col-11 col-md-11 col-lg-10 col-xl-9 col-xxl-7 noPadding">
                        <h1 class="text-center mb-2 mb-md-2">Consulta los registros</h1>

                        <!-- Formulario de búsqueda -->
                        <form action="#" method="GET">
                            <div class="row justify-content-center">
                                <div
                                    class="form-group mt-4 mb-0 col-12 col-md-10 col-lg-8 d-flex flex-wrap flex-sm-nowrap align-items-center justify-content-center bar-table"
                                >
                                    <select
                                        name="criterio"
                                        class="form-select green"
                                        aria-label="Tipo de búsqueda"
                                    >
                                        <option value="null" selected>
                                            Elige el tipo de búsqueda
                                        </option>
                                        <option
                                            value="Correo"
                                            title="Buscar por correo electrónico"
                                        >
                                            Correo
                                        </option>
                                        <option value="Nombre" title="Buscar por nombre">
                                            Nombre
                                        </option>
                                        <option value="Apellido" title="Buscar por apellido">
                                            Apellido
                                        </option>
                                        <option
                                            value="No_Ticket"
                                            title="Buscar por número de ticket"
                                        >
                                            No de ticket
                                        </option>
                                    </select>
                                    <input
                                        class="form-control input-table"
                                        name="valor"
                                        type="search"
                                        placeholder="Buscar registro..."
                                        id="example-search-input"
                                    />
                                    <button type="submit" class="mx-2 btn-search mt-3 mt-md-0">
                                        Buscar
                                    </button>
                                </div>

                                <div
                                    class="form-group my-4 col-12 col-md-10 col-lg-8 d-flex flex-wrap flex-sm-nowrap align-items-center justify-content-center bar-table"
                                >
                                    <label
                                        for="sucursal-select"
                                        class="labelInput w-100 text-center px-4 py-1"
                                        >Elige la sucursal</label
                                    >
                                    <select
                                        name="sucursal"
                                        id="sucursal-select"
                                        class="form-select"
                                        aria-
                                        label="Sucursal"
                                    >
                                        <option value="null" selected>Selecciona una opción</option>
                                        <option value="Acuña">Acuña</option>
                                        <option value="Apodaca centro">Apodaca centro</option>
                                        <option value="Aramberri">Aramberri</option>
                                        <option value="Buenavista">Buenavista</option>
                                        <option value="Cadereyta">Cadereyta</option>
                                        <option value="Castaños">Castaños</option>
                                        <option value="Colinas">Colinas</option>
                                        <option value="El Jaral">El Jaral</option>
                                        <option value="Frontera">Frontera</option>
                                        <option value="Garcia">Garcia</option>
                                        <option value="Girasoles">Girasoles</option>
                                        <option value="Hidalgo">Hidalgo</option>
                                        <option value="Israel Cavazos">Israel Cavazos</option>
                                        <option value="Libramiento">Libramiento</option>
                                        <option value="Lindavista">Lindavista</option>
                                        <option value="Madero">Madero</option>
                                        <option value="Manantiales">Manantiales</option>
                                        <option value="Mixcoac">Mixcoac</option>
                                        <option value="Montemorelos">Montemorelos</option>
                                        <option value="Nuevo Repueblo">Nuevo Repueblo</option>
                                        <option value="Paraje San Jose">Paraje San Jose</option>
                                        <option value="Parras">Parras</option>
                                        <option value="Paseo Monclova">Paseo Monclova</option>
                                        <option value="Piedras Negras">Piedras Negras</option>
                                        <option value="Pilares">Pilares</option>
                                        <option value="Pueblo Nuevo">Pueblo Nuevo</option>
                                        <option value="Ramos">Ramos</option>
                                        <option value="Rosita">Rosita</option>
                                        <option value="Saltillo Centro">Saltillo Centro</option>
                                        <option value="San Antonio">San Antonio</option>
                                        <option value="San Buena">San Buena</option>
                                        <option value="San Roque">San Roque</option>
                                        <option value="Santa Catarina">Santa Catarina</option>
                                        <option value="Santa Elena">Santa Elena</option>
                                        <option value="Sendero">Sendero</option>
                                        <option value="Sierrita">Sierrita</option>
                                        <option value="Solidaridad">Solidaridad</option>
                                        <option value="Urdiñola">Urdiñola</option>
                                        <!-- Opciones de sucursales -->
                                    </select>
                                    <button type="submit" class="mx-2 btn-search mt-3 mt-md-0">
                                        Buscar
                                    </button>
                                </div>
                            </div>
                        </form>

                        <!-- Tabla de resultados -->
                        <div class="row justify-content-center contentForm table">
                            <div class="col-12 p-2 p-md-5">
                                <div class="contentTable">
                                    <table class="table table-bordered w-100">
                                        <thead>
                                            <tr>
                                                <th scope="col">Fecha</th>
                                                <th scope="col">Tienda</th>
                                                <th scope="col">Conteo Participantes</th>
                                                <th scope="col">Conteo Boletos</th>
                                                <th scope="col">Conteo Premios</th>
                                                <th scope="col">Suma Monto</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            %%= ContentBlockByID(49592) =%%
                                            %%= ContentBlockByID(49587) =%%
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Footer -->
            <footer class="py-1">
                <div class="row">
                    <div class="col-12 text-center">
                        <div class="logo">
                            <img
                                loading="lazy"
                                width="200"
                                height="85"
                                src="https://image.hello.merco.email/lib/fe2a11747364047f721079/m/1/6d845bd4-5822-4d33-829b-faffec1d0632.png"
                                alt="Logo Merco"
                                class="img-fluid logoMerco"
                            />
                            <p>® All rights reserved — MERCO 2023</p>
                        </div>
                    </div>
                </div>
            </footer>
        </div>

        <!-- JS BOOTSTRAP -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
