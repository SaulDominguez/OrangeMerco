                 alt="Logo Merco" class="img-fluid logoMercoHero">
          </div>
        </div>
      </header>
      
      <!-- section tickets para revision -->
        <section class="py-5 filtro-ticket">
            <div class="row  justify-content-center">
                <div class="col-12 col-md-11 col-lg-10 col-xl-9 col-xxl-4 text-center">
                    <h1>Tikets para revisión</h1>
                    <div class="d-flex flex-wrap flex-sm-nowrap align-items-center justify-content-center">
                        <label class="etiqueta-filtro p-2" for="">Filtra los tickets :</label>
                        <select class="form-select" id="Validacion" name="Validacion">
                            <option selected disabled>Selecciona una opción</option>
                            <option value="Por validar">POR VALIDAR</option>
                            <option value="Validados">VALIDADOS</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>
        <!-- /section tickets para revision -->
      
      <!-- SECTION DE CARDS -->
      <section class="py-5">
        <div class="row justify-content-center ">
          <div class="col-12 col-md-11 col-lg-10 col-xl-9 col-xxl-8">
            <div class="row" id="ticket_container">
          
            </div>
          </div>
        </div>
      </section>
      <!-- / SECTION DE CARDS -->
      <!-- PAGINATION -->
      <section class="py-5">
        <div class="row justify-content-center">
          <div class="col-12 col-md-11 col-lg-10 col-xl-9 col-xxl-8 d-flex justify-content-center">
            <ul class="">
              <div class="pagination">
                <a id="prev_page" class="arrow">&lt;</a>
                <a id="last_page" >1</a>
                <a id="current_page" class="active">2</a>
                <a id="upcoming_page">3</a>
                <a id="next_page" class="arrow">&gt;</a>
              </div>
            </ul>
          </div>
        </div>
      </section>
      <!-- /PAGINATION -->
      <!-- boton cargar -->
      <section class="mb-4">
        <div class="row justify-content-center">
          <div class="col-12 col-md-11 col-lg-10 col-xl-9 col-xxl-8 d-flex justify-content-center btncargar">
            <button>Cargar tickets</button>
          </div>
        </div>
      </section>
      <!-- /boton cargar -->
      <footer class=" py-5">
        <div class="row">
          <div class="col-12">
            <div class="logo text-center">
              <img loading="lazy" width="200" height="85"
                   src="https://image.hello.merco.email/lib/fe2a11747364047f721079/m/1/6d845bd4-5822-4d33-829b-faffec1d0632.png"

              <p>® All rights reserved — MERCO 2025
              </p>
            </div>
          </div>
        </div>

      <!-- MODAL TICKET -->
      <!-- Modal -->
      <div class="modal fade" id="ticketModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="exampleModalLabel">Modal title
              </h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body ">
              <!-- Imagen -->
              <div class=" col-md-12 card-m text-center">
                <img src="https://image.hello.merco.email/lib/fe2a11747364047f721079/m/1/5dcd85e3-40d4-464d-9325-a92f4769174b.jpg" class="img-fluid img-ticket"
                     alt="Imagen de ejemplo" id="modal_image">
              </div>
              <div class="mt-4">
                <h1 class="modal-title fs-5 text-center" id="exampleModalLabemt-3">Valida los datos contra
                  la
                  imagen
                </h1>
                <!-- Subtítulo -->
                <h2 class="text-center">Tus datos personales
                </h2>
              </div>
              <section>
                <div class=" contentForm p-4 mt-4 ">
                  <div class="">
                    <!-- Formulario en dos columnas -->
                    <form class="mt-4 mb-4">
                      <div class="row">
                        <div class="col-md-6 mb-3">
                          <label for="nombre" class="form-label">Nombre</label>
                          <input type="text" class="form-control" id="nombre" required>
                        </div>
                        <div class="col-md-6 mb-3">
                          <label for="apellido" class="form-label">Apellido</label>
                          <input type="text" class="form-control" id="apellido" required>
                        </div>
                      </div>
                      <div class="row">
                        <div class="col-md-6 mb-3">
                          <label for="telefono" class="form-label">Teléfono</label>
                          <input type="tel" class="form-control" id="telefono" required>
                        </div>
                        <div class="col-md-6 mb-3">
                          <label for="sucursal" class="form-label">Sucursal</label>
                          <input type="text" class="form-control" id="sucursal" required>
                        </div>
                      </div>
                    </form>
                    <div class="modal-footer justify-content-center ">
                      <button type="button"
                              class="button1" id="validateButton">Validar</button>
                      <button type="button" class="button2"
                              data-bs-dismiss="modal" id="discardButton">Descalificar</button>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          </div>
        </div>
